<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        min-width: 260px;
        margin: 0;
        padding: 12px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
      }
      label {
        display: block;
        font-size: 12px;
        color: #4b5563;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: white;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <label for="session">Active session id</label>
    <input id="session" placeholder="ses_..." />
    <button id="save">Connect this tab</button>
    <div id="status">Waiting for a Breadcrumbs session.</div>
    <script src="popup.js"></script>
  </body>
</html>
