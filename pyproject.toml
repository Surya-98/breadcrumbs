[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breadcrumbs"
version = "0.1.0"
description = "Privacy-first continual-learning assistant for local activity context and cloud memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pymongo>=4.7",
  "mss>=9.0",
  "pillow>=10.0",
  "PySide6>=6.7",
  "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]

[project.scripts]
breadcrumbs = "breadcrumbs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
